<!doctype html>

<html lang="">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yusuf Berat Bayraktar</title>
  <meta name="description"
    content="Yusuf Berat Bayraktar'ın portfolyosu — Cloud & DevOps Mühendisi. AWS, Terraform, Docker ve Kubernetes deneyimi." />
  <meta name="keywords"
    content="Yusuf Berat Bayraktar, portfolyo, kartvizit, cloud, devops, aws, terraform, docker, kubernetes" />
  <link id="favicon" rel="icon" type="image/svg+xml" href="image/favicon.svg" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <main class="page-wrapper">
    <!-- Top Bar: Studio Trigger, Personnel Switcher & Language -->
    <div class="d-flex justify-content-between align-items-center px-4 pt-3 top-action-bar">
      <div class="d-flex align-items-center gap-2">
        <button id="open-studio-btn" class="btn btn-sm btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#studioModal">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-pencil-square me-1" viewBox="0 0 16 16">
            <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
            <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
          </svg>
          <span data-i18n="studio__open_btn">Card Studio</span>
        </button>
        <button id="share-card-btn" class="btn btn-sm btn-outline-dark fw-semibold">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-share me-1" viewBox="0 0 16 16">
            <path d="M13.5 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.5 2.5 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5m-8.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m11 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/>
          </svg>
          <span data-i18n="studio__share_btn">Share Link</span>
        </button>
      </div>
      <div class="d-flex align-items-center gap-2">
        <select id="team-switcher" class="form-select form-select-sm d-none" aria-label="Team profiles"></select>
        <button id="lang-toggle" class="btn btn-sm btn-outline-secondary fw-bold"></button>
      </div>
    </div>

    <div class="container text-center my-auto py-4">
      <div class="row g-4 justify-content-center">
        <!-- Sol  Profil -->
        <div class="col-12 col-md-4 d-flex">
          <div class="card shadow-sm border-0 rounded-3 w-100">
            <div class="card-body d-flex flex-column align-items-center">
              <div class="d-flex justify-content-center pt-2">
                <img id="profile-photo" class="profile-img rounded-circle" alt="" />
              </div>
              <h5 id="profile-name" class="card-title fw-bold mt-3"></h5>
              <p id="profile-role" class="text-muted small mb-0"></p>
              <p id="profile-location" class="text-muted small mb-0"></p>

              <div class="w-100 text-center mt-3">
                <p class="text-muted small fw-semibold mb-2" data-i18n="profile__connect_title"></p>
                <div id="social-container" class="links-wrapper justify-content-center"></div>
              </div>

              <div class="w-100 text-center mt-2">
                <p class="text-muted small fw-semibold mb-2" data-i18n="profile__tools_title"></p>
                <div id="tools-container" class="links-wrapper justify-content-center"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sağ Hakkımda  Accordion -->
        <div class="col-12 col-md-8 d-flex">
          <div class="card shadow-sm text-start w-100">
            <div class="card-body">
              <div class="accordion" id="accordionkv">
                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                      data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne"
                      data-i18n="accordion__about_btn"></button>
                  </h2>
                  <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionkv">
                    <div class="accordion-body">
                      <div id="about-container"></div>
                    </div>
                  </div>
                </div>

                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                      data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo"
                      data-i18n="accordion__exp_btn"></button>
                  </h2>
                  <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionkv">
                    <div class="accordion-body">
                      <div id="exp-container"></div>
                    </div>
                  </div>
                </div>

                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                      data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree"
                      data-i18n="accordion__cert_btn"></button>
                  </h2>
                  <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionkv">
                    <div class="accordion-body">
                      <div id="cert-container"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card Studio Modal -->
    <div class="modal fade" id="studioModal" tabindex="-1" aria-labelledby="studioModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="studioModalLabel" data-i18n="studio__modal_title">Card Studio & Personnel Manager</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-start">
            <ul class="nav nav-tabs mb-3" id="studioTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="single-card-tab" data-bs-toggle="tab" data-bs-target="#single-card" type="button" role="tab">Single Card Editor</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="bulk-team-tab" data-bs-toggle="tab" data-bs-target="#bulk-team" type="button" role="tab">Bulk Team & Media Optimizer</button>
              </li>
            </ul>

            <div class="tab-content" id="studioTabContent">
              <!-- Single Card Editor Form -->
              <div class="tab-pane fade show active" id="single-card" role="tabpanel">
                <form id="card-editor-form">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label small fw-semibold">First Name</label>
                      <input type="text" class="form-control form-control-sm" id="edit-first-name" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small fw-semibold">Last Name</label>
                      <input type="text" class="form-control form-control-sm" id="edit-last-name" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small fw-semibold">Role (TR)</label>
                      <input type="text" class="form-control form-control-sm" id="edit-role-tr" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small fw-semibold">Role (EN)</label>
                      <input type="text" class="form-control form-control-sm" id="edit-role-en" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small fw-semibold">Location (TR)</label>
                      <input type="text" class="form-control form-control-sm" id="edit-location-tr">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small fw-semibold">Location (EN)</label>
                      <input type="text" class="form-control form-control-sm" id="edit-location-en">
                    </div>
                    <div class="col-12">
                      <label class="form-label small fw-semibold">Avatar Image (Auto-optimized to WebP)</label>
                      <input type="file" class="form-control form-control-sm" id="edit-photo-file" accept="image/*">
                      <div class="form-text small text-muted">Uploaded photos are automatically resized and converted to WebP on-device.</div>
                    </div>
                    <div class="col-12">
                      <label class="form-label small fw-semibold">Bio Paragraph (TR)</label>
                      <textarea class="form-control form-control-sm" id="edit-bio-tr" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                      <label class="form-label small fw-semibold">Bio Paragraph (EN)</label>
                      <textarea class="form-control form-control-sm" id="edit-bio-en" rows="2"></textarea>
                    </div>
                  </div>
                </form>
              </div>

              <!-- Bulk Team & Media Optimizer Tab -->
              <div class="tab-pane fade" id="bulk-team" role="tabpanel">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Batch Image Optimizer (WebP Multi-resolution)</label>
                  <input type="file" class="form-control form-control-sm" id="bulk-images-input" accept="image/*" multiple>
                  <div class="form-text small text-muted">Select multiple staff images to optimize locally in parallel.</div>
                  <div id="bulk-images-status" class="mt-2 small"></div>
                </div>
                <hr>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Team Profiles (JSON Export / Import)</label>
                  <div class="d-flex gap-2 mb-2">
                    <button type="button" id="export-json-btn" class="btn btn-sm btn-outline-secondary">Export JSON</button>
                    <button type="button" id="import-json-btn" class="btn btn-sm btn-outline-secondary">Import JSON</button>
                    <input type="file" id="import-json-file" accept=".json" class="d-none">
                  </div>
                  <textarea id="team-json-preview" class="form-control font-monospace small" rows="6" placeholder="JSON preview or paste team config here..."></textarea>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" id="save-card-btn" class="btn btn-sm btn-primary">Apply & Generate Link</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/card-state.js"></script>
  <script src="js/image-processor.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/icon.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
