<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep rich space/slate colors -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Monogram Gradient: Sleek Cyan to Royal Blue -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle Glow/Shadow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base: Rounded Card resembling iOS/macOS App Icon style -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Decorative Orbit/Bracket Line: Represents DevOps / Cloud Architecture loop -->
  <path d="M 120 80 A 220 220 0 0 1 392 80" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="12" stroke-linecap="round" />
  <path d="M 392 432 A 220 220 0 0 1 120 432" fill="none" stroke="rgba(37, 99, 235, 0.08)" stroke-width="12" stroke-linecap="round" />

  <!-- Monogram text with premium typeface styling and glow -->
  <text x="51.5%" y="54%" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" 
        font-weight="900" 
        font-size="200" 
        fill="url(#brandGrad)" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        letter-spacing="-10"
        filter="url(#glow)">YB</text>
</svg>
