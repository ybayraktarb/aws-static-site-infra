<!doctype html>

<html lang="">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yusuf Berat Bayraktar</title>
  <meta name="description"
    content="Yusuf Berat Bayraktar'ın portfolyosu — Cloud & DevOps Mühendisi. AWS, Terraform, Docker ve Kubernetes deneyimi." />
  <meta name="keywords"
    content="Yusuf Berat Bayraktar, portfolyo, kartvizit, cloud, devops, aws, terraform, docker, kubernetes" />
  <link id="favicon" rel="icon" type="image/svg+xml" href="image/favicon.svg" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <main class="page-wrapper">
    <!-- Dil Butonu -->
    <div class="d-flex justify-content-end px-4 pt-3">
      <button id="lang-toggle" class="btn btn-sm btn-outline-secondary fw-bold"></button>
    </div>

    <div class="container text-center my-auto py-4">
      <div class="row g-4 justify-content-center">
        <!-- Sol  Profil -->
        <div class="col-12 col-md-4 d-flex">
          <div class="card shadow-sm border-0 rounded-3 w-100">
            <div class="card-body d-flex flex-column align-items-center">
              <div class="d-flex justify-content-center pt-2">
                <img id="profile-photo" class="profile-img rounded-circle" alt="" />
              </div>
              <h5 id="profile-name" class="card-title fw-bold mt-3"></h5>
              <p id="profile-role" class="text-muted small mb-0"></p>
              <p id="profile-location" class="text-muted small mb-0"></p>

              <div class="w-100 text-center mt-3">
                <p class="text-muted small fw-semibold mb-2" data-i18n="profile__connect_title"></p>
                <div id="social-container" class="links-wrapper justify-content-center"></div>
              </div>

              <div class="w-100 text-center mt-2">
                <p class="text-muted small fw-semibold mb-2" data-i18n="profile__tools_title"></p>
                <div id="tools-container" class="links-wrapper justify-content-center"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sağ Hakkımda  Accordion -->
        <div class="col-12 col-md-8 d-flex">
          <div class="card shadow-sm text-start w-100">
            <div class="card-body">
              <div class="accordion" id="accordionkv">
                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                      data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne"
                      data-i18n="accordion__about_btn"></button>
                  </h2>
                  <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionkv">
                    <div class="accordion-body">
                      <div id="about-container"></div>
                    </div>
                  </div>
                </div>

                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                      data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo"
                      data-i18n="accordion__exp_btn"></button>
                  </h2>
                  <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionkv">
                    <div class="accordion-body">
                      <div id="exp-container"></div>
                    </div>
                  </div>
                </div>

                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                      data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree"
                      data-i18n="accordion__cert_btn"></button>
                  </h2>
                  <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionkv">
                    <div class="accordion-body">
                      <div id="cert-container"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/translations.js"></script>
  <script src="js/icon.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
